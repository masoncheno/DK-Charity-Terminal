<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Betting Terminal V6</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">BT</div>
      <div>
        <div class="brand-title">BETTING TERMINAL</div>
        <div class="brand-sub">V6 · LIVE SPORTS · DATA · MODEL</div>
      </div>
    </div>
    <nav id="nav">
      <button data-page="dashboard">Command</button>
      <button data-page="games">Games</button>
      <button data-page="bets">Bets</button>
      <button data-page="analytics">Analytics</button>
      <button data-page="model">Model Lab</button>
      <button data-page="settings">Settings</button>
    </nav>
    <div class="live-pill" id="livePill">Checking connection…</div>
  </header>

  <main id="main"></main>

  <div id="toast"></div>

  <div class="modal hidden" id="betModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Log Bet</h2>
        <button id="closeModal">×</button>
      </div>
      <form id="betForm">
        <input type="hidden" id="betGameId">
        <div class="form-grid">
          <label>Bettor<input id="betBettor" placeholder="Your name" required></label>
          <label>Sport<input id="betSport" placeholder="NFL / NBA / MLB..." required></label>
          <label>Event<input id="betEvent" placeholder="Team A vs Team B" required></label>
          <label>Market<input id="betMarket" placeholder="Spread / ML / Total / Prop" required></label>
          <label>Selection<input id="betSelection" placeholder="Selection" required></label>
          <label>Odds<input id="betOdds" type="number" placeholder="-110" required></label>
          <label>Stake<input id="betStake" type="number" step="0.01" placeholder="1.00" required></label>
          <label>Notes<textarea id="betNotes" placeholder="Reason / matchup / injury / line note"></textarea></label>
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost" id="cancelBet">Cancel</button>
          <button class="primary" type="submit">Save Bet</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
